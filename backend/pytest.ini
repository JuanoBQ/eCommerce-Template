[tool:pytest]
DJANGO_SETTINGS_MODULE = ecommerce.settings.test
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --tb=short
    --strict-markers
    --disable-warnings
    --cov=ecommerce
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    --cov-fail-under=40
    --reuse-db
    --nomigrations
    --create-db
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    api: marks tests as API tests
    auth: marks tests as authentication tests
    payment: marks tests as payment tests
    product: marks tests as product tests
    order: marks tests as order tests
    user: marks tests as user tests
    admin: marks tests as admin tests
    performance: marks tests as performance tests
    security: marks tests as security tests
